name: Robot Framework Tests

on: 
  workflow_dispatch:
    inputs:
      threads:
        type: number
        required: true
        default: 1
  push:
    branches: [ main, develop ]
  pull_request:
    branches: [ main, develop ]

permissions:
  contents: read
  checks: write
  pull-requests: write

jobs:
  run-robot-framework-tests:
    runs-on: ubuntu-latest
    name: Run Robot Framework Tests
    timeout-minutes: 30

    steps:
    - name: Checkout code
      uses: actions/checkout@v4
      with:
        fetch-depth: 0

    - name: Set up Python
      uses: actions/setup-python@v5
      with:
        python-version: '3.11'
        cache: 'pip'

    - name: Install Robot Framework and dependencies
      run: |
        python -m pip install --upgrade pip
        pip install robotframework robotframework-seleniumlibrary pabot

    - name: Run Robot Framework Tests
      run: |
        pabot --testlevelsplit \
              --processes ${{ github.event.inputs.threads }} \
              --outputdir ./results \
              tests/
      continue-on-error: true

    - name: Generate test report
      if: always()
      run: |
        rebot --merge --outputdir ./results ./results/output*. xml || true

    - name: Upload test results
      if: always()
      uses: actions/upload-artifact@v4
      with:
        name: robot-test-results-${{ github.run_id }}
        path: results/
        retention-days: 30
        if-no-files-found: warn

    - name: Publish test results
      if: always()
      uses: EnricoMi/publish-unit-test-result-action@v2
      with:
        files: results/output. xml
        check_name: Robot Framework Test Results

    - name: Comment PR with test results
      if: always() && github.event_name == 'pull_request'
      uses: actions/github-script@v7
      with:
        script: |
          const fs = require('fs');
          const resultsPath = './results/output. xml';
          if (fs.existsSync(resultsPath)) {
            github.rest.issues.createComment({
              issue_number: context. issue.number,
              owner: context.repo.owner,
              repo: context.repo.repo,
              body: '✅ Robot Framework tests completed.  Check the artifacts for detailed results.'
            });
          }
